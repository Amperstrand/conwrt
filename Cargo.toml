[workspace]
resolver = "2"
members = [
    "crates/conwrt-types",
    "crates/conwrt-core",
    "crates/conwrt-maas",
    "crates/conwrt-protocols",
    "crates/conwrt-image",
    "crates/conwrt-agent-proto",
    "providers/conwrt-local-std",
    "apps/conwrt-cli",
    "apps/conwrt-agent",
]
# Tier-C firmware (ADR-0002): no_std MCU builds that must never enter
# host `cargo test --workspace`. CI builds them explicitly with --target and
# gates them with cargo size (STM32) / GCC size (ESP32-S3, ADR-0012).
exclude = ["apps/conwrt-stm32", "apps/conwrt-esp32s3"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Amperstrand/conwrt"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
pollster = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "process", "macros", "fs"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
postcard-rpc = { version = "0.12", default-features = false, features = ["cobs"] }
embedded-io = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
