[package]
name = "conwrt-types"
description = "Shared domain types for conwrt: device models, MAC/OUI identification (species-level data from models/*.json)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["json"]
# Filesystem registry loading (requires std). JSON *parsing* is always on:
# the lossless `extras` representation (#118) made serde_json structural.
json = ["std"]
std = []

[dependencies]
serde = { workspace = true }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[lints]
workspace = true
