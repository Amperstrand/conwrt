[package]
name = "conwrt-types"
description = "Shared domain types for conwrt: device models, MAC/OUI identification (species-level data from models/*.json)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["json"]
# JSON parsing + filesystem registry loading (requires std).
json = ["dep:serde_json", "std"]
std = []

[dependencies]
serde = { workspace = true }
serde_json = { version = "1", optional = true }

[lints]
workspace = true
