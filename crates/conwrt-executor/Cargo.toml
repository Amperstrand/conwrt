[package]
name = "conwrt-executor"
description = "Conwrt standalone-executor core (#226 slice 1): resumable image-transfer window (chunk acks, resume tokens), bounded-RAM U-Boot recovery HTTP POST pump, WebKit-shaped multipart writer — Tier-A no_std, host-tested against a one-request mock recovery server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# No default features beyond the no_std core; `std` exists so host
# integration tests can pull the proto std runtime if needed.
default = []
std = ["conwrt-agent-proto/std"]
# `TcpHttpIo` — an `HttpIo` impl over embassy-net 0.9's `TcpSocket` — for
# firmware that runs the recovery POST over Ethernet (#226 slice 3).
# Mirrors conwrt-agent-io's `embassy-net` feature exactly: embedded-io-async
# is version-matched to embassy-net's own requirement so the write-side
# impl calls resolve against the same copy the socket implements.
# embassy-net has NO default smoltcp feature set: tcp + proto-ipv4 +
# medium-ethernet is the minimal Ethernet-attached profile.
embassy-net = ["dep:embassy-net", "dep:embedded-io-async"]

[dependencies]
conwrt-agent-proto = { path = "../conwrt-agent-proto", default-features = false }
embassy-net = { version = "0.9", default-features = false, features = ["tcp", "proto-ipv4", "medium-ethernet"], optional = true }
embedded-io-async = { version = "0.7.0", optional = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
