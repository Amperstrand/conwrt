[package]
name = "conwrt-protocols"
description = "Protocol integrations for conwrt — XMODEM via the `xmodem` crate (libraries-first policy; fills the README-promised serial flash method — #106; reliability follow-ups #124)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
# std builds use the xmodem crate's std::io trait bindings; no_std builds
# implement `xmodem::io::{Read, Write}` at the driver (MCU, M5+).
# embedded-io-async's std feature adds the std::io Error interop the
# serial_io adapter's error type needs.
std = ["xmodem/std", "embedded-io-async/std"]

[dependencies]
embedded-io-async = { version = "0.7.0", default-features = false }
xmodem = { version = "0.4", default-features = false }

[dev-dependencies]
crc16 = "0.4"

[lints]
workspace = true
