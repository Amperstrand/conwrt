[package]
name = "conwrt-serial"
description = "Host-std serial console driver for conwrt — linted line-chunked script delivery, command FIFO semantics, and FT232R UART-break recovery (parity-matrix §5; Rust port of scripts/serial_transport.py)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# default-features = false: libudev is only needed for port ENUMERATION;
# this driver opens by explicit path/spec, so CI builders stay libudev-free.
serialport = { version = "4", default-features = false }
thiserror = "2"

[dev-dependencies]
# pty fixtures + poll-bounded reads in the integration tests only
# (no real serial hardware is ever opened by the test suite).
nix = { version = "0.29", features = ["term", "poll"] }

[lints]
workspace = true
