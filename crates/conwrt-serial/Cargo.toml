[package]
name = "conwrt-serial"
description = "Host-std serial console driver for conwrt — linted line-chunked script delivery, command FIFO semantics, and FT232R UART-break recovery (parity-matrix §5; Rust port of scripts/serial_transport.py)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# default-features = false: libudev is only needed for port ENUMERATION;
# this driver opens by explicit path/spec, so CI builders stay libudev-free.
serialport = { version = "4", default-features = false }
thiserror = "2"
# milestone detection — the SHARED vocabulary from conwrt-probe-core
# (serial_monitor.py's extraction); the boot-capture loop never forks
# its own matcher set (parity-matrix §5 rule).
conwrt-probe-core = { path = "../conwrt-probe-core" }
# host-side expected hash for the base64 flash driver — matches what
# BusyBox `sha256sum` prints on the device (AGENTS.md: Python-side hash
# algorithms MUST match BusyBox).
sha2 = "0.10"
# chunk encoding for the base64 serial-flash driver.
base64 = "0.22"
# session.json metadata for the console monitor (and its tests parse it
# back — the record must BE json, not look like it).
serde = { workspace = true }
serde_json = "1"

[dev-dependencies]
# pty fixtures + poll-bounded reads in the integration tests only
# (no real serial hardware is ever opened by the test suite).
nix = { version = "0.29", features = ["term", "poll"] }
# property invariants for the telnet codec + window discipline
proptest = "1.4"

[lints]
workspace = true
