# rsyslog-bench.conf — UDP syslog receiver for the conwrt bench (ai-legion).
# Pattern file: deploy via scripts/bench_rsyslog_deploy.sh, which substitutes
# the log directory. Real IPs stay in local bench records (data/sessions/).
#
# Receives RFC3164 UDP :514 from OpenWrt devices (uci system log_ip/log_port
# or `logread -f -r <host> <port>`). Routes per-device by source IP (devices
# send weak hostnames); the IP->name map lives in the deploy script.
#
# UDP is lossy BY DESIGN ACCEPTANCE (research: rsyslog docs) — alerts must
# never depend on log delivery alone; bench_watch.py SNAP polling is the
# liveness oracle.

module(load="imudp")
input(type="imudp" port="514")

# Device map: source IP -> stable name (extend as units adopt log_ip)
if ($fromhost-ip == 'SWITCH_MGMT_IP') then { set $!device = "switch"; stop } else { set $!device = $fromhost-ip }

template(name="PerDevice" type="string"
         string="/var/log/bench/%$!device%/%$YEAR%-%$MONTH%-%$DAY%.log")

action(type="omfile" dynaFile="PerDevice")

# Never mix bench device logs into the host's own syslog files
stop
