# rsyslog-bench.conf — UDP syslog receiver for the conwrt bench (ai-legion).
# Pattern file: deploy via scripts/bench_rsyslog_deploy.sh, which substitutes
# {{LOGDIR}}. Real IPs stay in local bench records (data/sessions/).
#
# Receives RFC3164 UDP :514 from OpenWrt devices (uci system log_ip/log_port
# or `logread -f -r <host> <port>`). Routes per-device by source IP into
# {{LOGDIR}}/<ip>/<date>.log. Two hard-won rules:
#   1. The imudp input MUST bind its own ruleset: without it the action+stop
#      catches the HOST'S OWN messages too (error-flood into 127.0.0.1/ and
#      the host's logs silently stop flowing to their normal files).
#   2. rsyslog runs as the 'syslog' user — {{LOGDIR}} must be owned by it,
#      or every dynafile open fails Permission-denied (messages discarded).
# UDP is lossy BY DESIGN ACCEPTANCE — alerts never depend on log delivery
# alone; bench_watch.py SNAP polling is the liveness oracle.

module(load="imudp")
input(type="imudp" port="514" ruleset="bench")

template(name="PerDevice" type="string" string="{{LOGDIR}}/%fromhost-ip%/%$YEAR%-%$MONTH%-%$DAY%.log")

ruleset(name="bench") {
    action(type="omfile" dynaFile="PerDevice" createDirs="on")
}
