[package]
name = "postcard-rpc-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Spike: deliberately OUTSIDE the conwrt workspace (ADR-0004 prototype;
# findings decide whether a real conwrt-agent-proto crate follows).
[workspace]

[dependencies]
cobs = "0.5.1"
postcard = "1.1.3"
postcard-rpc = { version = "0.12", features = ["use-std", "cobs"] }
postcard-schema = { version = "0.2.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "net", "macros", "time", "io-util", "sync"] }
