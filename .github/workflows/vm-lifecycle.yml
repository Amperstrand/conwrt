name: VM Flash Lifecycle (exclusive)

# conwrt #583: test_sysupgrade_keep_config_lifecycle kept flapping on the
# shared bench host — local re-runs land in the sibling-QEMU/port-contention
# class (40 VM-start errors in the 2026-10-28 attempt 3), so the
# environment, not the code, decided the outcome three runs in a row.
#
# This workflow gives the test what it can never get locally: a CLEAN,
# EXCLUSIVE host. A GitHub-hosted runner is a fresh single-tenant VM per
# job — no sibling QEMUs, no shared /tmp state, free 2222/2223 — and the
# concurrency group guarantees at most one lifecycle run per scope at a
# time (per-PR runs cancel-in-progress on new pushes; the scheduled slot
# never overlaps itself).
#
# Two legs:
#   - bootstrap: one cheap openwrt_vm test — downloads + preps the image
#     and materializes the one-time pristine qcow2 base the flash fixture
#     requires (flash_vm skips without it; "run the integration suite once
#     first" is this step).
#   - lifecycle: tests/integration/test_flash_lifecycle.py — the #583
#     discriminating re-run (env-flake vs #518 regression), now on a host
#     where any failure is a REAL failure.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'  # nightly off-peak; runs against master
  pull_request:
    paths:
      - '.github/workflows/vm-lifecycle.yml'
      - 'tests/integration/test_flash_lifecycle.py'
      - 'tests/integration/conftest.py'
      - 'scripts/vm_port.py'
      - 'models/virtual-x86-64.json'

concurrency:
  group: vm-lifecycle-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flash-lifecycle:
    runs-on: ubuntu-latest
    # Generous vs the 15-min `make ci` cap (#563): image download + prep,
    # two KVM VM boots, and a full sysupgrade cycle legitimately take
    # ~10-15 min on a cold runner; 35 min still fails RED on a hang.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + enable KVM access
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
          # Hosted runners ship /dev/kvm as 0660 root:kvm — the runner user
          # is not in the kvm group. Widen access (the udev rule makes it
          # survive module reloads; the chmod covers the already-present node).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
          test -e /dev/kvm || { echo "::error::/dev/kvm missing — hosted-runner nested virt unavailable (expected on public-repo ubuntu runners)"; exit 1; }
          test -w /dev/kvm || { echo "::error::/dev/kvm still not writable:"; ls -l /dev/kvm; exit 1; }
          qemu-system-x86_64 --version
          qemu-img --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install conwrt
        run: python -m pip install -e '.[dev]'
      - name: Bootstrap pristine VM base (one cheap openwrt_vm test)
        # Materializes .openwrt.img + .openwrt-base.qcow2 (download, sudo
        # loop-mount prep, qemu-img convert) so the flash fixture's
        # pristine-base gate passes instead of skipping. Nested-virt
        # runners boot userspace slower than bare KVM hosts — widen the
        # SSH wait accordingly.
        env:
          CONWRT_VM_SSH_WAIT_LOOPS: '120'
        run: |
          set +e
          pytest tests/integration/test_sqm.py::test_openssh_available -v \
            --timeout=1500 --timeout-method=signal \
            --junitxml=test-results/vm-lifecycle/bootstrap-junit.xml
          rc=$?
          set -e
          echo "== bootstrap post-mortem (pytest rc=$rc) =="
          tail -c 6000 tests/integration/.serial.log 2>/dev/null || echo "(no session serial log)"
          ss -tlnp 2>/dev/null | grep -E ':2222|:2223' || echo "(no listener on 2222/2223)"
          ps aux | grep -E '[q]emu-system' || echo "(no qemu running)"
          exit "$rc"
      - name: Flash lifecycle test (exclusive host)
        env:
          CONWRT_VM_SSH_WAIT_LOOPS: '120'
        run: |
          set +e
          pytest tests/integration/test_flash_lifecycle.py -v \
            --timeout=1500 --timeout-method=signal \
            --junitxml=test-results/vm-lifecycle/lifecycle-junit.xml
          rc=$?
          set -e
          echo "== lifecycle post-mortem (pytest rc=$rc) =="
          for f in tests/integration/.openwrt-flash-serial.log tests/integration/.serial.log; do
            echo "-- $f:"; tail -c 6000 "$f" 2>/dev/null || echo "   (absent)"
          done
          ss -tlnp 2>/dev/null | grep -E ':2222|:2223' || echo "(no listener on 2222/2223)"
          ps aux | grep -E '[q]emu-system' || echo "(no qemu running)"
          exit "$rc"
      - name: Collect VM serial logs
        if: always()
        run: |
          # upload-artifact drops dotfiles listed by path — copy to plain names
          cp tests/integration/.serial.log test-results/vm-lifecycle/session-serial.log 2>/dev/null || true
          cp tests/integration/.openwrt-flash-serial.log test-results/vm-lifecycle/flash-serial.log 2>/dev/null || true
      - name: Upload VM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-lifecycle-evidence-${{ github.run_id }}
          path: |
            test-results/vm-lifecycle/
          if-no-files-found: ignore
