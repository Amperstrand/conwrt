name: Deny
on:
  push:
    branches: [master]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'deny.toml'
      - '**/Cargo.toml'
      - '.github/workflows/deny.yml'
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'deny.toml'
      - '**/Cargo.toml'
      - '.github/workflows/deny.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    runs-on: [self-hosted, legion-vm]
    steps:
      - uses: actions/checkout@v4
      # Follows rust-toolchain.toml (pinned 1.99.0 since #149), same as
      # rust.yml — avoids the @stable-vs-pin mismatch called out there.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - run: cargo deny check
