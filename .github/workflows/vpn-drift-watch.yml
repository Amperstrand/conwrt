name: VPN Drift Watch

on:
  schedule:
    # Mondays 07:00 UTC — weekly provider-API drift early warning
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install conwrt
        run: python -m pip install -e '.[dev]'
      - name: Drift watch (live contracts + gluetun scan)
        run: python3 scripts/vpn-drift-watch.py
        env:
          # optional owner-added secrets; absent → those contract tests skip
          CONWRT_LIVE_NORDVPN_TOKEN: ${{ secrets.CONWRT_LIVE_NORDVPN_TOKEN }}
          CONWRT_LIVE_MULLVAD_TOKEN: ${{ secrets.CONWRT_LIVE_MULLVAD_TOKEN }}
