name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              # positive-only: dorny negations do NOT rescind a broad
              # '**' positive (empirically confirmed on PRs #553/#556 —
              # a docs-only diff still matched), so enumerate code
              # paths/types instead of trying to exclude docs
              - 'Makefile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'go.mod'
              - 'go.sum'
              - 'pyproject.toml'
              - 'requirements.txt'
              - '*.py'
              - '*.sh'
              - '*.toml'
              - '**/*.go'
              - '**/*.py'
              - '**/*.rs'
              - '**/*.sh'
              - '**/*.toml'
              - '**/*.yml'
              - '**/*.yaml'
              - '.github/**'
              - 'ansible/**'
              - 'apps/**'
              - 'cmd/**'
              - 'crates/**'
              - 'examples/**'
              - 'firmware/**'
              - 'labgrid/**'
              - 'models/**'
              - 'patches/**'
              - 'providers/**'
              - 'recipes/**'
              - 'roles/**'
              - 'scripts/**'
              - 'spikes/**'
              - 'tests/**'
  test:
    needs: changes
    # Job-level gate, deliberately NOT a workflow-level `paths:` filter:
    # the `test (3.x)` jobs are required status checks, and a skipped-by-
    # workflow run would leave them "Expected" forever, blocking docs-only
    # merges. A job skipped by `if:` reports `skipped`, which satisfies
    # branch protection. Same pattern as ccid-firmware-rs ci.yml.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OS tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run non-hardware CI
        run: make ci
  # Single always-run aggregate for branch protection to require. The
  # skipped matrix never emits per-coordinate `test (3.x)` checks, so
  # those names sit "expected" forever on docs-only PRs and block merges
  # (observed on #553). Require THIS job instead: it runs always and is
  # green when the matrix passed OR was correctly skipped for docs-only.
  ci-ok:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate verdict
        run: |
          echo "changes.code=${{ needs.changes.outputs.code }} test=${{ needs.test.result }}"
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "docs-only change: matrix correctly skipped"; exit 0
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "matrix did not succeed"; exit 1
          fi
