name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
  test:
    needs: changes
    # Job-level gate, deliberately NOT a workflow-level `paths:` filter:
    # the `test (3.x)` jobs are required status checks, and a skipped-by-
    # workflow run would leave them "Expected" forever, blocking docs-only
    # merges. A job skipped by `if:` reports `skipped`, which satisfies
    # branch protection. Same pattern as ccid-firmware-rs ci.yml.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OS tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run non-hardware CI
        run: make ci
