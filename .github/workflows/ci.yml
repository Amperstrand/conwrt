name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              # positive-only: dorny negations do NOT rescind a broad
              # '**' positive (empirically confirmed on PRs #553/#556 —
              # a docs-only diff still matched), so enumerate code
              # paths/types instead of trying to exclude docs
              - 'Makefile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'go.mod'
              - 'go.sum'
              - 'pyproject.toml'
              - 'requirements.txt'
              - '*.py'
              - '*.sh'
              - '*.toml'
              - '**/*.go'
              - '**/*.py'
              - '**/*.rs'
              - '**/*.sh'
              - '**/*.toml'
              - '**/*.yml'
              - '**/*.yaml'
              - '.github/**'
              - 'ansible/**'
              - 'apps/**'
              - 'cmd/**'
              - 'crates/**'
              - 'examples/**'
              - 'firmware/**'
              - 'labgrid/**'
              - 'models/**'
              - 'patches/**'
              - 'providers/**'
              - 'recipes/**'
              - 'roles/**'
              - 'scripts/**'
              - 'spikes/**'
              - 'tests/**'
  test:
    needs: changes
    runs-on: ubuntu-latest
    # hard job cap (issue #563): probabilistic runner-side hang (one
    # leg of the same tree green while others hang in make ci) must
    # fail RED at 15 min, never block merges forever. make ci needs
    # ~5-6 min; per-test naming comes from pytest-timeout.
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OS tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run non-hardware CI
        # STEP-level gate (the #558 job-level gate collapsed the matrix
        # to a single skipped check named `test`, while branch protection
        # requires the four leg contexts `test (3.10..3.13)` — docs-only
        # PRs stayed blocked). Legs must always RUN so each reports;
        # docs-only changes make every leg a fast success.
        if: needs.changes.outputs.code == 'true'
        run: make ci
      - name: Docs-only fast path
        if: needs.changes.outputs.code != 'true'
        run: echo "docs-only diff — test matrix skipped by the changes filter (legs report success)"
