name: Rust

on:
  pull_request:
    paths:
      - "crates/**"
      - "providers/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
      - "Makefile"
      - "models/**"
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "providers/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Follows rust-toolchain.toml (pinned 1.99.0 since #149); installing
      # components/targets for the PINNED toolchain keeps the no_std gate
      # working (broken by the @stable-vs-pin mismatch after #149 merged).
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: fmt + clippy + test + no_std gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo check -p conwrt-types -p conwrt-core -p conwrt-protocols -p conwrt-agent-proto --no-default-features --target thumbv7em-none-eabihf
      # Tier-C firmware (apps/conwrt-stm32, excluded from the workspace).
      # Must run with CWD inside the app: its .cargo/config.toml carries the
      # cortex-m linker flags, and cargo resolves config from the CWD.
      # Size budget: text+data <= 128 KiB flash, bss <= 96 KiB RAM
      # (F469NI has 2 MiB flash / 384 KiB SRAM).
      - name: MCU firmware build + size gate
        working-directory: apps/conwrt-stm32
        run: |
          cargo fmt -- --check
          cargo build --release
          cargo install cargo-binutils --locked
          rustup component add llvm-tools
          SIZE_OUT=$(cargo size --release | tail -1)
          echo "size: $SIZE_OUT"
          SIZE=$(echo "$SIZE_OUT" | awk '{print $1 + $2}')
          RAM=$(echo "$SIZE_OUT" | awk '{print $3}')
          test "$SIZE" -le 131072 && test "$RAM" -le 98304
