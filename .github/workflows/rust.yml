name: Rust

on:
  pull_request:
    paths:
      - "crates/**"
      - "providers/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
      - "Makefile"
      - "models/**"
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "providers/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Follows rust-toolchain.toml (pinned 1.99.0 since #149); installing
      # components/targets for the PINNED toolchain keeps the no_std gate
      # working (broken by the @stable-vs-pin mismatch after #149 merged).
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: fmt + clippy + test + no_std gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo check -p conwrt-types -p conwrt-core -p conwrt-protocols --no-default-features --target thumbv7em-none-eabihf
