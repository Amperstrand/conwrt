[package]
name = "conwrt-cli"
description = "conwrt command-line interface (thin frontend over conwrt-core — ADR-0008)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "conwrt"
path = "src/main.rs"

[dependencies]
conwrt-types = { path = "../../crates/conwrt-types" }
conwrt-core = { path = "../../crates/conwrt-core" }
conwrt-local-std = { path = "../../providers/conwrt-local-std" }
conwrt-agent-proto = { path = "../../crates/conwrt-agent-proto" }
conwrt-maas = { path = "../../crates/conwrt-maas" }
clap = { workspace = true }
pollster = { workspace = true }
tokio = { workspace = true }

xz2 = { version = "0.1", features = ["static"] }
[dev-dependencies]
httpmock = "0.7"
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = "3"

[lints]
workspace = true
