[package]
name = "conwrt-local-std"
description = "Local Linux/macOS capability provider for conwrt (tokio): link probing, ping, ARP lookup (M2, ADR-0003)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
conwrt-core = { path = "../../crates/conwrt-core" }
conwrt-maas = { path = "../../crates/conwrt-maas" }
conwrt-types = { path = "../../crates/conwrt-types" }
httparse = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
russh = "0.64"
serde = { workspace = true }
thiserror = "2"
tokio = { workspace = true }

[dev-dependencies]
httpmock = "0.7"
rand = "0.10"
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = "3"

[lints]
workspace = true
